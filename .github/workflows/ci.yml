
name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        if: github.event_name == 'push'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.121.141.125

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy to Raspberry Pi
        if: github.event_name == 'push' && success()
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy
          chmod 600 ~/.ssh/pi_deploy

          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/pi_deploy \
            -o StrictHostKeyChecking=yes \
            jarvis@"$PI_HOST" \
            'cd /home/jarvis/apps/pi-cicd-demo && git pull --ff-only && npm ci --omit=dev && sudo systemctl restart pi-cicd-demo'

          rm -f ~/.ssh/pi_deploy
